# mwm CUI supplies its own panel and bar shadows. Picom handles client windows.
# XRender is suitable for software-only X11 sessions.
backend = "xrender";
vsync = false;

rules = (
  { match = "!override_redirect"; shadow = true; fading = true; corner-radius = 10; },
  { match = "fullscreen || window_type = 'desktop' || window_type = 'dock'";
    shadow = false; fading = false; corner-radius = 0; },
  { match = "class_g = 'mwm'"; shadow = false; fading = false; corner-radius = 0; }
);

shadow-radius = 16;
shadow-opacity = 0.36;
shadow-offset-x = -12;
shadow-offset-y = -10;

# Optional effects for sessions using backend = "glx".
# Add this rule after the mwm rule to enable a subtle shader on popups.
# { match = "class_i = 'mwm-panel'"; shader = "/absolute/path/to/panel-sheen.glsl"; }
#
# To animate application windows, add this entry before the fullscreen rule.
# { match = "!override_redirect && !fullscreen";
