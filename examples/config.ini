# Copy to ~/.config/mwm/config.ini. Run mwmc reload after saving.
# Unspecified values use compiled defaults. Xresources override [theme]
# and the legacy appearance resources such as mwm.gappx.

[layout]
default = stack
nmaster = 1
mfact = 0.5
gappx = 8
borderpx = 2
roundcorners = false
focusfollowsmouse = true

[bar]
topbar = true
showbar = true
barmargin = 10
barvmargin = 7
barseggap = 8
segradius = 11
titlealign = 1

[tray]
showsystray = true
showtraybar = true
systraymon = 0

[motion]
duration = 150
reduced_motion = false
shadows = true

[theme]
font = Geist:pixelsize=14
monofont = Geist Mono

[timezones]
New York = America/New_York
London = Europe/London
Tokyo = Asia/Tokyo

[clock]
# An executable path or a command on PATH. Receives title and body as arguments.
# timer_hook = /home/me/.local/bin/mwm-timer

[tags]
1 = w1
2 = w2

[tag_monitors]
# Stable one-based tag ID = zero-based monitor index (-1 to leave unowned).
1 = 0

# Adding named rules replaces the built-in list. Later matches win per field.
# Use [rules] alone to start with an empty list.
# [rule pinentry]
# class = pinentry
# floating = true
#
# [rule work browser]
# class = chromium-work
# tag = 1
#
# [rule dialogs]
# type = DIALOG
# floating = true
