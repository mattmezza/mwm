# Copy to ~/.config/mwm/config.ini. Uncomment settings to override defaults.
# Run mwmc reload after saving. Xresources take precedence for theme and bar
# styling and the legacy layout resources borderpx, gappx, cornerradius, and mfact.
# Lengths are in X11 pixels. Opacity is 0 (transparent) to 255 (opaque).

[layout]
# default = stack
# nmaster = 1
# mfact = 0.5
# gappx = 8
# borderpx = 4
# roundcorners = false
# cornerradius = 3
# resizehints = false
# focusfollowsmouse = true
# warpcursor = true
# movemod = 64
# snap = 8
# Layouts are cols, stack, and float. In the X modifier mask, 64 is Super.

[bar]
# topbar = true
# showbar = true
# barheight = 0
# barfontsize = 16
# barvertpad = 6
# barpadx = 12
# barmargin = 6
# barvmargin = 6
# barseggap = 10
# separators = false
# segradius = 6
# tagradius = 3
# segments = tags, title | | status, system, power, datetime, tray
# hidden_segments =
# titlealign = 0
# timer_indicator = true
# Font size 0 follows [theme] font sizing. Height 0 uses the bar font size
# and padding. Use left | center | right groups with comma-separated segment
# names in screen order. Leave a group empty or omit a segment to remove it.
# Each name can be an item or a group from [segments].
# List comma-separated placement names in hidden_segments to start them hidden.
# For example, hidden_segments = system, power keeps both available to toggle.
# Set separators to true to draw dividers between items in the same segment.
# Without segments, titlealign still selects 0 (after tags), 1 (center), or 2 (right).
# Margins measure from the screen edge to the painted bar.
# During a timer, the Xresources selection color (mwm.selbg) fills the clock icon.

[segments]
# tags = spaces, layout
# system = cpu, gpu, ram, load, network, disk
# power = battery, volume, brightness
# datetime = date, time
# Define a group as any ordered list of items. Names use a–z, 0–9, _ or -.
# Items are spaces, layout, title, status, cpu, gpu, ram, load, network, disk,
# date, time, tray, battery, volume, and brightness. Place each item at most once.
# Use mwmc segment list or mwmc segment toggle NAME for live visibility.

[system]
# cpu_interval = 500
# cpu_history = 40
# cpu_width = 36
# gpu_history = 40
# gpu_width = 36
# gpu_device =
# show_temperature = false
# cpu_temp_critical = 90
# gpu_temp_critical = 85
# ram_history = 40
# ram_width = 36
# load_width = 26
# network_width = 32
# network_interface =
# disk_width = 30
# disk_device =
# tooltip_delay = 350
# cpu_interval sets the initial system sample interval in ms (100–60000).
# Scroll up over any metric to sample faster, or down to sample slower (125–5000 ms).
# CPU, GPU and RAM charts display 2–120 samples and use a width of 16–200 pixels.
# The load chart is 18–80 px wide. Network and disk chart widths are 16–80 px.
# Empty device names select available GPU counters and sensors, physical network
# interfaces and whole physical disks. Specify a DRM card, interface, or block device name.
# CPU and GPU hover popups show temperature when a sensor is available.
# Enable show_temperature to also put readings beside the charts when space allows.
# Critical thresholds are in °C (0–150). At or above the threshold, the reading
# uses systemdanger. Temperature values use the theme's monofont.
# Hover delay is in ms (0–2000, -1 off).

[controls]
# interval = 1000
# battery_device =
# backlight_device =
# audio_sink = @DEFAULT_AUDIO_SINK@
# battery_step = 5
# volume_step = 5
# brightness_step = 5
# brightness_min = 1
# battery_low = 25
# battery_critical = 10
# popup_width = 270
# Empty device names auto-detect a Linux power_supply or backlight device.
# Volume uses wpctl. Brightness uses brightnessctl and its normal permissions.
# Scroll steps are in percentage points. The battery control changes the
# charge limit when the device provides a writable limit.
# Right-click volume to mute or unmute. Right-click brightness to toggle 0%
# and the previous level (50% if there is no previous reading).
# Battery warning/danger uses mwm.systemwarn and mwm.systemdanger.

[tray]
# showsystray = true
# showtraybar = true
# systraymon = -1
# systrayspacing = 7
# systrayvertpad = 6
# notificationslast = true
# Set notificationslast to false for the usual tray docking order.

[applets]
# Tray popup width and number of visible list rows.
# width = 386
# rows = 6
# An empty name selects an adapter automatically. Examples are wlan0 and hci0.
# wifi_interface =
# bluetooth_adapter =
# Handle NetworkManager requests for passwords and VPN credentials.
# wifi_secret_agent = 1
# Handle Bluetooth pairing requests initiated by other devices or applications.
# bluetooth_default_agent = 1
# -1 follows keyboard focus. A zero-based monitor index pins the tray.

[panels]
# radius = 6
# opacity = 255
# calendar_width = 394
# clock_width = 448
# palette_width = 530
# Widths are capped to the available screen space.

[motion]
# duration = 150
# popup_enter = 145
# popup_exit = 100
# popup_distance = 14
# reduced_motion = false
# shadows = true
# shadow_opacity = 112
# bar_shadow_blur = 2
# panel_shadow_blur = 6
# Duration controls segment transitions and other motion in milliseconds.
# Popup durations are in milliseconds and travel distance is in pixels.
# Reduced motion makes transitions immediate. Shadows need an X11 compositor.

[theme]
# font = Geist:pixelsize=18
# monofont = Geist Mono
# normfg = #c0caf5
# normbg = #1a1b26
# normborder = #3b4261
# selfg = #1a1b26
# selbg = #7aa2f7
# selborder = #7aa2f7
# urgfg = #1a1b26
# urgbg = #f7768e
# urgborder = #f7768e
# titlefg = #c0caf5
# titlebg = #1a1b26
# statusfg = #c0caf5
# statusbg = #1a1b26
# barbg = #16161e
# systemwarn = #e0af68
# systemdanger = #ff5266
# traysuccess = #9ece6a
# normbgalpha = 255
# selbgalpha = 255
# urgbgalpha = 255
# titlebgalpha = 255
# statusbgalpha = 255
# barbgalpha = 0
# Set barbgalpha above 0 to paint a strip behind the segments.
# Charts use selbg through 50% and blend into systemwarn at 75% and
# systemdanger at 90%. The same colors can be set as mwm.* Xresources.
# Symbolic tray icons use selbg, systemdanger, systemwarn, and traysuccess.

[timezones]
# The local clock is always present. Add up to eight IANA zones.
# Zurich = Europe/Zurich
# New York = America/New_York
# Tokyo = Asia/Tokyo

[clock]
# timer_hook =
# in_presets = 5, 10, 15, 20, 30, 45, 60, 90, 120, 150, 180, 240, 360, 480, 720
# at_presets = 12
# Leave empty for notify-send with a desktop notification daemon.
# A custom executable receives title and body as arguments. Use its absolute
# path or a command on PATH.
# List up to 24 durations in minutes, or leave in_presets empty to hide them.
# at_presets picks up to 24 upcoming local hours. Use 0 to hide them.

[tags]
# 1 = w1
# 2 = w2
# 3 = w3
# 4 = w4
# 5 = m1
# 6 = m2
# 7 = p4
# 8 = p3
# 9 = p2
# 10 = p1

[tag_monitors]
# 1 = 0
# 2 = -1
# 3 = -1
# 4 = -1
# 5 = -1
# 6 = -1
# 7 = -1
# 8 = -1
# 9 = -1
# 10 = -1
# Each key is a stable one-based tag ID. -1 leaves it unassigned.

# Uncomment a complete set of rules to replace the built-in list.
# Later matching rules win per field. Match class, instance, title, or type.
# Use [rules] alone for an empty list.
#
# [rule volume control]
# class = pavucontrol
# floating = true
#
# [rule display settings]
# class = arandr
# floating = true
#
# [rule floating terminal]
# class = st-256color
# title = termfloat
# floating = true
#
# [rule floating calculator]
# class = st-256color
# title = calcfloat
# floating = true
#
# [rule screen sharing indicator]
# title = is sharing your screen
# floating = true
#
# [rule personal browser]
# class = chromium-personal
# tag = 10
#
# [rule work browser]
# class = chromium-work
# tag = 1
#
# [rule pinentry]
# class = Pinentry
# floating = true
#
# [rule dialogs]
# type = DIALOG
# floating = true
#
# [rule utilities]
# type = UTILITY
# floating = true
#
# [rule toolbars]
# type = TOOLBAR
# floating = true
#
# [rule splash screens]
# type = SPLASH
# floating = true
