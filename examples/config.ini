# Copy to ~/.config/mwm/config.ini. Uncomment settings to override defaults.
# Run mwmc reload after saving. Xresources take precedence for theme and bar
# styling and the legacy layout resources borderpx, gappx, cornerradius, and mfact.
# Lengths are in X11 pixels. Opacity is 0 (transparent) to 255 (opaque).

[layout]
# default = stack
# nmaster = 1
# mfact = 0.5
# gappx = 8
# borderpx = 4
# roundcorners = false
# cornerradius = 3
# resizehints = false
# focusfollowsmouse = true
# warpcursor = true
# movemod = 64
# snap = 8
# Layouts are cols, stack, and float. In the X modifier mask, 64 is Super.

[bar]
# topbar = true
# showbar = true
# barheight = 0
# barfontsize = 16
# barvertpad = 6
# barpadx = 12
# barmargin = 6
# barvmargin = 6
# barseggap = 10
# segradius = 6
# tagradius = 3
# segments = tags, title | | status, system, datetime, tray
# titlealign = 0
# timerprogressheight = 2
# Font size 0 follows [theme] font sizing. Height 0 uses the bar font size
# and padding. Use left | center | right groups with comma-separated segment
# names in screen order. Leave a group empty or omit a segment to hide it.
# tags includes the layout button, and datetime includes the date and clock.
# Without segments, titlealign still selects 0 (after tags), 1 (center), or 2 (right).
# Margins measure from the screen edge to the painted bar.
# Timer progress uses the Xresources selection color (mwm.selbg). Set height
# to 0 to hide the progress line.

[system]
# cpu_interval = 250
# cpu_history = 40
# cpu_width = 44
# ram_history = 40
# ram_width = 44
# load_width = 26
# tooltip_delay = 350
# cpu_interval sets the system sample interval in ms (100–60000).
# CPU and RAM charts display 2–120 samples and use a width of 16–200 pixels.
# The load chart is 18–80 pixels wide. Hover delay is in ms (0–2000, -1 off).

[tray]
# showsystray = true
# showtraybar = true
# systraymon = -1
# systrayspacing = 7
# systrayvertpad = 6
# -1 follows keyboard focus. A zero-based monitor index pins the tray.

[panels]
# radius = 6
# opacity = 255
# calendar_width = 394
# clock_width = 448
# palette_width = 530
# Widths are capped to the available screen space.

[motion]
# duration = 150
# reduced_motion = false
# shadows = true
# shadow_opacity = 112
# bar_shadow_blur = 2
# panel_shadow_blur = 6
# Duration controls segment transitions and other motion in milliseconds.
# Reduced motion makes transitions immediate. Shadows need an X11 compositor.

[theme]
# font = Geist:pixelsize=18
# monofont = Geist Mono
# normfg = #c0caf5
# normbg = #1a1b26
# normborder = #3b4261
# selfg = #1a1b26
# selbg = #7aa2f7
# selborder = #7aa2f7
# urgfg = #1a1b26
# urgbg = #f7768e
# urgborder = #f7768e
# titlefg = #c0caf5
# titlebg = #1a1b26
# statusfg = #c0caf5
# statusbg = #1a1b26
# barbg = #16161e
# systemwarn = #e0af68
# systemdanger = #ff5266
# normbgalpha = 255
# selbgalpha = 255
# urgbgalpha = 255
# titlebgalpha = 255
# statusbgalpha = 255
# barbgalpha = 0
# Set barbgalpha above 0 to paint a strip behind the segments.
# Charts use selbg through 50% and blend into systemwarn at 75% and
# systemdanger at 90%. The same colors can be set as mwm.* Xresources.

[timezones]
# The local clock is always present. Add up to eight IANA zones.
# Zurich = Europe/Zurich
# New York = America/New_York
# Tokyo = Asia/Tokyo

[clock]
# timer_hook =
# in_presets = 10, 20, 30, 60, 90
# at_presets = 5
# Leave empty for notify-send with a desktop notification daemon.
# A custom executable receives title and body as arguments. Use its absolute
# path or a command on PATH.
# List up to five durations in minutes, or leave in_presets empty to hide them.
# at_presets picks how many upcoming local hours to show. Use 0 to hide them.

[tags]
# 1 = w1
# 2 = w2
# 3 = w3
# 4 = w4
# 5 = m1
# 6 = m2
# 7 = p4
# 8 = p3
# 9 = p2
# 10 = p1

[tag_monitors]
# 1 = 0
# 2 = -1
# 3 = -1
# 4 = -1
# 5 = -1
# 6 = -1
# 7 = -1
# 8 = -1
# 9 = -1
# 10 = -1
# Each key is a stable one-based tag ID. -1 leaves it unassigned.

# Uncomment a complete set of rules to replace the built-in list.
# Later matching rules win per field. Match class, instance, title, or type.
# Use [rules] alone for an empty list.
#
# [rule volume control]
# class = pavucontrol
# floating = true
#
# [rule display settings]
# class = arandr
# floating = true
#
# [rule floating terminal]
# class = st-256color
# title = termfloat
# floating = true
#
# [rule floating calculator]
# class = st-256color
# title = calcfloat
# floating = true
#
# [rule screen sharing indicator]
# title = is sharing your screen
# floating = true
#
# [rule personal browser]
# class = chromium-personal
# tag = 10
#
# [rule work browser]
# class = chromium-work
# tag = 1
#
# [rule pinentry]
# class = Pinentry
# floating = true
#
# [rule dialogs]
# type = DIALOG
# floating = true
#
# [rule utilities]
# type = UTILITY
# floating = true
#
# [rule toolbars]
# type = TOOLBAR
# floating = true
#
# [rule splash screens]
# type = SPLASH
# floating = true
